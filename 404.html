<!doctype html>
<html lang="en">
<head>

<title>Page not found — MSCALE Tools</title>

<style>/* ============================================================
   MSCALE Tools — Design System v2
   One coherent system: tokens → base → components → pages
   ============================================================ */

/* ---------- Tokens ---------- */
:root {
  --bg: #0b0e14;
  --bg2: #10141d;
  --card: #151a24;
  --card2: #1a2130;
  --border: #222a3a;
  --border2: #2e3849;
  --text: #e8ecf4;
  --muted: #97a1b6;
  --soft: #b9c2d2;
  --accent: #ff7000;
  --accent2: #ffa25c;
  --ok: #34d399;
  --err: #f87171;
  --r-sm: 9px;
  --r-md: 13px;
  --r-lg: 18px;
  --r-pill: 999px;
  --sh-sm: 0 1px 2px rgba(0, 0, 0, .35);
  --sh-md: 0 10px 30px -8px rgba(0, 0, 0, .5);
  --sh-lg: 0 24px 60px -16px rgba(0, 0, 0, .6);
  --sh-accent: 0 8px 26px -6px rgba(255, 112, 0, .45);
  --ring: 0 0 0 3px rgba(255, 112, 0, .22);
  --grad: linear-gradient(135deg, #ff7000, #ff9a3c);
  --ease: cubic-bezier(.22, .8, .32, 1);
}

html[data-theme="light"] {
  --bg: #f4f6fa;
  --bg2: #ffffff;
  --card: #ffffff;
  --card2: #f8fafd;
  --border: #e4e8f0;
  --border2: #d4dae5;
  --text: #141b28;
  --muted: #5b6575;
  --soft: #3d4757;
  --accent: #e05e00;
  --accent2: #b34f00;
  --sh-sm: 0 1px 2px rgba(23, 32, 47, .06);
  --sh-md: 0 10px 30px -10px rgba(23, 32, 47, .14);
  --sh-lg: 0 24px 60px -20px rgba(23, 32, 47, .18);
  --sh-accent: 0 8px 24px -8px rgba(224, 94, 0, .35);
  --ring: 0 0 0 3px rgba(224, 94, 0, .16);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent2); text-decoration: none; transition: color .15s var(--ease); }
a:hover { text-decoration: underline; }
::selection { background: rgba(255, 112, 0, .35); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 8px; border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  html { scroll-behavior: auto; }
}
.container { max-width: 1140px; margin: 0 auto; padding: 0 22px; }
h1, h2, h3, h4 { letter-spacing: -.02em; line-height: 1.25; }

/* ---------- Header ---------- */
header.site {
  background: rgba(11, 14, 20, .8);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
html[data-theme="light"] header.site { background: rgba(255, 255, 255, .85); box-shadow: 0 1px 14px rgba(23, 32, 47, .07); }
header.site .container { display: flex; align-items: center; gap: 16px; height: 64px; }
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 19px; color: var(--text); letter-spacing: -.02em;
}
.brand:hover { text-decoration: none; }
.brand span { color: var(--accent); }
.brand-tile {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--grad); color: #fff;
  box-shadow: var(--sh-accent);
}
.brand-tile svg { width: 17px; height: 17px; }
nav.main { display: flex; align-items: center; gap: 2px; margin-left: auto; }
nav.main a {
  color: var(--muted); font-size: 13.5px; font-weight: 500;
  padding: 8px 11px; border-radius: var(--r-sm); position: relative;
  transition: color .15s var(--ease), background .15s var(--ease);
}
nav.main a:hover { color: var(--text); background: var(--card2); text-decoration: none; }
nav.main a.nav-cta {
  color: #fff; background: var(--grad); font-weight: 600; margin-left: 8px;
  padding: 8px 15px; border-radius: var(--r-sm); box-shadow: var(--sh-accent);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), filter .15s var(--ease);
}
nav.main a.nav-cta:hover { filter: brightness(1.08); background: var(--grad); transform: translateY(-1px); }
.nav-actions { display: flex; align-items: center; gap: 8px; margin-left: 10px; }
.theme-toggle, .nav-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm);
  width: 37px; height: 37px; cursor: pointer; color: var(--muted); padding: 0;
  transition: color .15s var(--ease), border-color .15s var(--ease), background .15s var(--ease);
}
.theme-toggle:hover, .nav-toggle:hover { color: var(--text); border-color: var(--border2); background: var(--card2); }
.theme-toggle svg, .nav-toggle svg { width: 17px; height: 17px; }
.theme-toggle .ic-moon { display: none; }
html[data-theme="light"] .theme-toggle .ic-sun { display: none; }
html[data-theme="light"] .theme-toggle .ic-moon { display: inline; }
@media (max-width: 900px) {
  .nav-toggle { display: inline-flex; }
  nav.main {
    display: none; position: absolute; top: 64px; left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 2px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 10px 16px 16px; box-shadow: var(--sh-lg);
  }
  nav.main.open { display: flex; }
  nav.main a { padding: 12px; font-size: 15px; }
  nav.main a.nav-cta { margin: 8px 0 0; text-align: center; }
  .nav-actions { margin-left: auto; }
}

/* ---------- Hero (homepage) ---------- */
.hero-new { text-align: center; padding: 84px 0 30px; position: relative; }
.hero-new::before {
  content: ""; position: absolute; inset: -80px 0 auto 0; height: 420px;
  background:
    radial-gradient(560px 240px at 30% 0%, rgba(255, 112, 0, .13), transparent 70%),
    radial-gradient(560px 240px at 72% 8%, rgba(96, 165, 250, .09), transparent 70%);
  pointer-events: none; z-index: -1;
}
html[data-theme="light"] .hero-new::before { opacity: .55; }
.hero-kicker {
  display: inline-flex; align-items: center; gap: 7px;
  text-transform: uppercase; letter-spacing: .15em; font-size: 11.5px; font-weight: 700;
  color: var(--accent); background: rgba(255, 112, 0, .1);
  border: 1px solid rgba(255, 112, 0, .25); border-radius: var(--r-pill);
  padding: 6px 14px; margin: 0 0 20px;
}
.hero-new h1 { font-size: clamp(34px, 6vw, 54px); margin: 0 0 16px; line-height: 1.1; font-weight: 800; }
.hero-new h1 em, .tools-head h1 em {
  font-style: normal;
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.hero-sub { color: var(--muted); max-width: 620px; margin: 0 auto 30px !important; font-size: 17px; line-height: 1.65; }
.hero-search { display: flex; gap: 10px; max-width: 640px; margin: 0 auto; position: relative; align-items: stretch; }
.hero-search input { flex: 1; padding-left: 46px; height: 52px; font-size: 15.5px; border-radius: var(--r-md); box-shadow: var(--sh-md); }
.hero-search .btn { flex-shrink: 0; height: 52px; padding: 0 24px; font-size: 15px; border-radius: var(--r-md); }
.hero-search .search-ic { left: 16px; }

/* legacy hero (kept for compatibility) */
.hero { text-align: center; padding: 60px 0 30px; }
.hero h1 { font-size: 40px; margin: 0 0 12px; }
.hero h1 em, .hero h1 span { color: var(--accent); font-style: normal; }
.hero p { color: var(--muted); max-width: 640px; margin: 0 auto 26px; }
.search-wrap { max-width: 560px; margin: 0 auto; position: relative; }
#search {
  width: 100%; padding: 14px 18px; font-size: 16px; padding-left: 44px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); color: var(--text); outline: none;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
#search:focus { border-color: var(--accent); box-shadow: var(--ring); }
.search-ic {
  position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--muted); pointer-events: none;
}

/* ---------- Sections & grids ---------- */
h2.section { font-size: 25px; margin: 52px 0 18px; font-weight: 700; position: relative; padding-bottom: 12px; }
h2.section::after {
  content: ""; position: absolute; left: 0; bottom: 0; width: 44px; height: 3px;
  background: var(--grad); border-radius: 2px;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 16px; }

/* ---------- Cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 18px; display: block; color: var(--text);
  box-shadow: var(--sh-sm);
  transition: border-color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
a.card:hover, .card:hover {
  border-color: rgba(255, 112, 0, .55); text-decoration: none;
  transform: translateY(-3px); box-shadow: var(--sh-md);
  background: var(--card2);
}
.card h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
.card .tag {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 12px; font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  color: var(--ok); background: rgba(52, 211, 153, .1);
  border: 1px solid rgba(52, 211, 153, .25);
  border-radius: var(--r-pill); padding: 3px 10px;
}
.card .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.card.soon { opacity: .62; }
.card.soon .tag { color: var(--muted); background: var(--bg2); border-color: var(--border); }
.card.soon .tag::before { background: var(--muted); }
.card-head { display: flex; align-items: center; gap: 11px; margin-bottom: 8px; }
.card-head h3 { margin: 0; }
.card .card-head svg { width: 20px; height: 20px; flex-shrink: 0; }
.card .card-head .icon-box { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; }
.card .card-head .icon-box svg { width: 19px; height: 19px; }
.card-ic { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.badge {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  border-radius: var(--r-pill); padding: 3px 10px;
}
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(52, 211, 153, .15); }
.status.live { color: var(--ok); }
.status.soon { color: var(--muted); }
.status.soon .dot { background: var(--muted); box-shadow: 0 0 0 3px rgba(152, 161, 182, .12); }

/* ---------- Category cards (homepage) ---------- */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 16px; }
.cat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 20px; color: var(--text); display: block; position: relative;
  box-shadow: var(--sh-sm);
  transition: border-color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
}
.cat-card:hover {
  border-color: rgba(255, 112, 0, .55); text-decoration: none;
  transform: translateY(-3px); box-shadow: var(--sh-md);
}
.cat-card h3 { margin: 12px 0 5px; font-size: 16px; font-weight: 600; }
.cat-card p { margin: 0; color: var(--muted); font-size: 13px; }
.icon-box {
  display: inline-flex; align-items: center; justify-content: center;
  width: 42px; height: 42px; border-radius: 11px;
  background: rgba(255, 112, 0, .12); color: var(--accent);
  transition: transform .18s var(--ease);
}
.icon-box svg { width: 22px; height: 22px; }
.cat-card:hover .icon-box { transform: scale(1.08); }
.cat-card .icon-box svg { width: 21px; height: 21px; }
.cat-arrow { display: inline-flex; margin-left: 6px; vertical-align: -3px; opacity: 0; transition: opacity .18s var(--ease), transform .18s var(--ease); }
.cat-arrow svg { width: 13px; height: 13px; }
.cat-card:hover .cat-arrow { opacity: 1; transform: translateX(3px); }

/* ---------- Feature strip ---------- */
.features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 40px 0 8px; }
.feature {
  display: flex; gap: 13px; align-items: flex-start; padding: 17px 16px;
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--card);
  box-shadow: var(--sh-sm);
  transition: border-color .18s var(--ease), transform .18s var(--ease);
}
.feature:hover { border-color: var(--border2); transform: translateY(-2px); }
.feature svg { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
.feature b { display: block; font-size: 14px; font-weight: 600; }
.feature span { font-size: 12.5px; color: var(--muted); }
.f-tile { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; }
.f-tile svg { width: 19px; height: 19px; }

/* ---------- Blog ---------- */
.blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.blog-card { display: flex; flex-direction: column; gap: 9px; }
.blog-card h3 { margin: 0; font-size: 16.5px; line-height: 1.35; font-weight: 600; }
.blog-card p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1; line-height: 1.6; }
.post-meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }

/* ---------- Breadcrumb ---------- */
.breadcrumb {
  display: flex; align-items: center; gap: 9px; padding: 24px 0 0;
  font-size: 13px; color: var(--muted); flex-wrap: wrap;
}
.breadcrumb a { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; transition: color .15s var(--ease); }
.breadcrumb a:hover { color: var(--accent2); text-decoration: none; }
.breadcrumb .chev { width: 13px; height: 13px; opacity: .5; }
.breadcrumb .crumb-ic { width: 14px; height: 14px; }
.breadcrumb span { color: var(--text); font-weight: 500; }

/* ---------- Tool page ---------- */
.tool-wrap { max-width: 780px; margin: 0 auto; }
.tool-head { padding: 34px 0 6px; }
.tool-title { display: flex; align-items: center; gap: 14px; }
.tool-ic { width: 34px; height: 34px; color: var(--accent); flex-shrink: 0; }
.tool-ic.big { width: 42px; height: 42px; }
.tool-head h1 { font-size: clamp(26px, 4.5vw, 34px); margin: 0 0 10px; font-weight: 700; }
.tool-head p { color: var(--muted); margin: 0; font-size: 15.5px; line-height: 1.65; }

/* Tool interface panel */
.panel {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 24px; margin: 20px 0;
  box-shadow: var(--sh-md); position: relative; overflow: hidden;
}
.panel::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--grad); opacity: .9;
}
label { display: block; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: 11px 13px; font-size: 15px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text); outline: none;
  font-family: inherit;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; line-height: 1.6; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: var(--ring); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > div { flex: 1; min-width: 140px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 20px; margin: 12px 8px 0 0;
  background: var(--grad); color: #fff; border: 0; border-radius: var(--r-sm);
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  box-shadow: var(--sh-accent);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), filter .15s var(--ease);
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); text-decoration: none; }
.btn:active { transform: translateY(0); }
.btn.ghost {
  display: inline-flex; align-items: center; gap: 7px;
  background: transparent; border: 1px solid var(--border2); color: var(--text);
  box-shadow: none;
}
.btn.ghost svg { width: 15px; height: 15px; }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); background: rgba(255, 112, 0, .06); }

/* Results */
.result {
  margin-top: 16px; padding: 15px 16px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: var(--r-sm);
  font-size: 15.5px; white-space: pre-wrap; word-break: break-word;
}
.result.big { font-size: 28px; font-weight: 700; color: var(--accent2); letter-spacing: -.01em; }
.result.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; line-height: 1.65; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 14px; }
.stat {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 12px 10px; text-align: center;
  transition: border-color .15s var(--ease);
}
.stat:hover { border-color: var(--border2); }
.stat b { display: block; font-size: 21px; color: var(--accent2); font-weight: 700; letter-spacing: -.01em; }
.stat span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.error { color: var(--err); margin-top: 10px; font-size: 13.5px; }
.copied { color: var(--ok); font-size: 13px; margin-left: 8px; font-weight: 600; }
.swatch { width: 100%; height: 64px; border-radius: var(--r-sm); border: 1px solid var(--border); margin-top: 14px; }

/* Color-palette rows (color tools) */
.pal-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pal-swatch {
  flex: 1; min-width: 74px; height: 88px; border-radius: var(--r-sm);
  display: flex; align-items: flex-end; justify-content: center; cursor: pointer;
  border: 1px solid var(--border); transition: transform .15s var(--ease), box-shadow .15s var(--ease);
}
.pal-swatch:hover { transform: translateY(-2px); box-shadow: var(--sh-md); }
.pal-swatch span { font-size: 11px; padding: 5px; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 3px rgba(0, 0, 0, .55); font-family: ui-monospace, monospace; }

/* Word-frequency bars */
.wf-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.wf-word { width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.wf-bar { height: 10px; background: var(--grad); border-radius: 5px; min-width: 2px; }
mark { background: rgba(255, 112, 0, .85); color: #fff; border-radius: 3px; padding: 0 2px; }
#img-preview { max-width: 100%; border-radius: var(--r-sm); border: 1px solid var(--border); margin-top: 14px; display: none; box-shadow: var(--sh-md); }

/* ---------- Long-form article ---------- */
.article { margin-top: 10px; font-size: 15.5px; }
.article h3, .prose h3 {
  font-size: 18px; margin: 26px 0 10px; font-weight: 700; letter-spacing: -.01em;
  padding-left: 13px; position: relative;
}
.article h3::before, .prose h3::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3.5px;
  background: var(--grad); border-radius: 2px;
}
.article p, .prose p { margin: 0 0 15px; color: var(--soft); line-height: 1.8; }
.article ul, .article ol, .prose ul, .prose ol { margin: 0 0 17px; padding-left: 23px; color: var(--soft); line-height: 1.72; }
.article li, .prose li { margin: 7px 0; }
.article li::marker, .prose li::marker { color: var(--accent); }
.prose { max-width: 780px; margin: 0 auto; font-size: 15.5px; }
.prose h1 { font-size: clamp(28px, 5vw, 36px); margin: 8px 0 18px; line-height: 1.22; font-weight: 800; }

/* ---------- Category page ---------- */
.cat-hero {
  display: flex; gap: 20px; align-items: flex-start; margin: 22px 0 6px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 26px 28px; box-shadow: var(--sh-md); position: relative; overflow: hidden;
}
.cat-hero::before {
