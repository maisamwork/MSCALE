<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Page not found — MSCALE Tools</title>
<meta name="robots" content="noindex"/>
<style>:root {
  --bg: #0f1117;
  --bg2: #161a23;
  --card: #1d222e;
  --border: #2a3040;
  --text: #e6e9f0;
  --muted: #9aa3b5;
  --accent: #ff7000;
  --accent2: #ffb066;
  --ok: #34d399;
  --err: #f87171;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

header.site {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
header.site .container { display: flex; align-items: center; gap: 18px; height: 60px; }
.brand { font-weight: 800; font-size: 20px; color: var(--text); }
.brand span { color: var(--accent); }
nav.main { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
nav.main a { color: var(--muted); font-size: 14px; }
nav.main a:hover { color: var(--text); text-decoration: none; }

.hero { text-align: center; padding: 60px 0 30px; }
.hero h1 { font-size: 40px; margin: 0 0 12px; }
.hero h1 em { color: var(--accent); font-style: normal; }
.hero p { color: var(--muted); max-width: 640px; margin: 0 auto 26px; }
.search-wrap { max-width: 560px; margin: 0 auto; }
#search {
  width: 100%; padding: 14px 18px; font-size: 16px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; color: var(--text); outline: none;
}
#search:focus { border-color: var(--accent); }

h2.section { font-size: 24px; margin: 44px 0 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; display: block; color: var(--text);
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-2px); }
.card h3 { margin: 0 0 6px; font-size: 16px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.card .tag { display: inline-block; margin-top: 10px; font-size: 11px; color: var(--accent2); }
.card.soon { opacity: .55; }
.card.soon .tag { color: var(--muted); }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.cat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px; color: var(--text); display: block;
}
.cat-card:hover { border-color: var(--accent); text-decoration: none; }
.cat-card .icon { font-size: 26px; }
.cat-card h3 { margin: 8px 0 4px; font-size: 16px; }
.cat-card p { margin: 0; color: var(--muted); font-size: 13px; }

.tool-wrap { max-width: 760px; margin: 0 auto; }
.tool-head { padding: 40px 0 10px; }
.tool-head h1 { font-size: 30px; margin: 0 0 8px; }
.tool-head p { color: var(--muted); margin: 0; }
.panel {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px; margin: 18px 0;
}
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: 10px 12px; font-size: 15px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); outline: none;
  font-family: inherit;
}
textarea { min-height: 140px; resize: vertical; font-family: ui-monospace, monospace; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > div { flex: 1; min-width: 140px; }
.btn {
  display: inline-block; padding: 10px 18px; margin: 10px 8px 0 0;
  background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
.result {
  margin-top: 14px; padding: 14px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 16px; white-space: pre-wrap; word-break: break-word;
}
.result.big { font-size: 26px; font-weight: 700; color: var(--accent2); }
.result.mono { font-family: ui-monospace, monospace; font-size: 14px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 20px; color: var(--accent2); }
.stat span { font-size: 12px; color: var(--muted); }
.error { color: var(--err); margin-top: 10px; font-size: 14px; }
.swatch { width: 100%; height: 60px; border-radius: 8px; border: 1px solid var(--border); margin-top: 12px; }
.copied { color: var(--ok); font-size: 13px; margin-left: 8px; }

footer.site { margin-top: 70px; border-top: 1px solid var(--border); background: var(--bg2); }
footer.site .container { padding: 26px 20px; color: var(--muted); font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .hero h1 { font-size: 28px; }
  nav.main { display: none; }
}
.pal-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.pal-swatch { flex: 1; min-width: 72px; height: 84px; border-radius: 8px; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; border: 1px solid var(--border); }
.pal-swatch span { font-size: 11px; padding: 4px; color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.wf-row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
.wf-word { width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.wf-bar { height: 10px; background: var(--accent); border-radius: 5px; min-width: 2px; }
mark { background: var(--accent); color: #fff; border-radius: 3px; padding: 0 2px; }
#img-preview { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 12px; display: none; }
.breadcrumb { display: flex; align-items: center; gap: 8px; padding: 22px 0 0; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.breadcrumb a { color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.breadcrumb a:hover { color: var(--accent2); }
.breadcrumb .chev { width: 13px; height: 13px; opacity: .6; }
.breadcrumb .crumb-ic { width: 14px; height: 14px; }
.breadcrumb span { color: var(--text); }
.brand-icon { width: 22px; height: 22px; color: var(--accent); }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.card-head h3 { margin: 0; }
.card-ic { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; }
.tool-title { display: flex; align-items: center; gap: 12px; }
.tool-ic { width: 30px; height: 30px; color: var(--accent); flex-shrink: 0; }
.tool-ic.big { width: 38px; height: 38px; }
.icon-box { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 10px; background: rgba(255, 112, 0, .12); color: var(--accent); }
.icon-box svg { width: 22px; height: 22px; }
.search-wrap { position: relative; }
.search-ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
#search { padding-left: 42px; }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 30px; }
.footer-brand p { color: var(--muted); font-size: 13px; margin: 10px 0 0; max-width: 300px; }
.footer-grid h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text); }
.footer-grid h4 + a, .footer-grid div > a { display: block; color: var(--muted); font-size: 13px; padding: 3px 0; }
.footer-grid div > a:hover { color: var(--accent2); text-decoration: none; }
.copyright { border-top: 1px solid var(--border); margin-top: 26px; padding-top: 16px; color: var(--muted); font-size: 12px; }
@media (max-width: 720px) { .footer-grid { grid-template-columns: 1fr; gap: 20px; } }

/* Long-form article (tool pages + blog) */
.article { margin-top: 8px; font-size: 15.5px; }
.article h3 { font-size: 17px; margin: 20px 0 8px; }
.article p { margin: 0 0 14px; color: var(--soft); line-height: 1.78; }
.article ul, .article ol { margin: 0 0 16px; padding-left: 22px; color: var(--soft); line-height: 1.7; }
.article li { margin: 7px 0; }
.article li::marker { color: var(--accent); }
.prose { max-width: 760px; margin: 0 auto; font-size: 15.5px; }
.prose h1 { font-size: 34px; margin: 6px 0 18px; line-height: 1.25; }
.prose h3 { font-size: 17px; margin: 20px 0 8px; }
.prose p { margin: 0 0 14px; color: var(--soft); line-height: 1.78; }
.prose ul, .prose ol { margin: 0 0 16px; padding-left: 22px; color: var(--soft); line-height: 1.7; }
.prose li { margin: 7px 0; }
.prose li::marker { color: var(--accent); }
.post-meta { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* New homepage */
.hero-new { text-align: center; padding: 72px 0 26px; }
.hero-kicker { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 700; color: var(--accent); margin: 0 0 14px; }
.hero-new h1 { font-size: 48px; margin: 0 0 14px; line-height: 1.15; }
.hero-sub { color: var(--muted); max-width: 600px; margin: 0 auto 28px !important; font-size: 16.5px; }
.hero-search { display: flex; gap: 10px; max-width: 640px; margin: 0 auto; position: relative; align-items: stretch; }
.hero-search input { flex: 1; padding-left: 44px; }
.hero-search .btn { flex-shrink: 0; }
.features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 36px 0 8px; }
.feature { display: flex; gap: 12px; align-items: flex-start; padding: 16px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
.feature svg { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
.feature b { display: block; font-size: 14px; }
.feature span { font-size: 12.5px; color: var(--muted); }
.blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.blog-card { display: flex; flex-direction: column; gap: 8px; }
.blog-card h3 { margin: 0; font-size: 16px; line-height: 1.35; }
.blog-card p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1; }
.blog-card:hover { border-color: var(--accent); text-decoration: none; }
@media (max-width: 900px) { .features { grid-template-columns: repeat(2, 1fr); } .blog-grid { grid-template-columns: 1fr; } .hero-new h1 { font-size: 34px; } }
@media (max-width: 520px) { .features { grid-template-columns: 1fr; } .hero-search { flex-direction: column; } .hero-search .btn { width: 100%; } }

/* Header redesign */
header.site {
  background: rgba(15, 17, 23, .82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand span { color: var(--accent); }
.brand-tile { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #ff7000, #ff9a3c); color: #fff; box-shadow: 0 2px 10px rgba(255, 112, 0, .35); }
.brand-tile svg { width: 16px; height: 16px; }
nav.main { display: flex; align-items: center; gap: 4px; margin-left: auto; }
nav.main a { color: var(--muted); font-size: 13.5px; font-weight: 500; padding: 7px 10px; border-radius: 8px; position: relative; }
nav.main a:hover { color: var(--text); background: var(--card); text-decoration: none; }
nav.main a.nav-cta { color: #fff; background: var(--accent); font-weight: 600; margin-left: 6px; }
nav.main a.nav-cta:hover { filter: brightness(1.1); background: var(--accent); }
.nav-toggle { display: none; margin-left: auto; background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 38px; height: 38px; align-items: center; justify-content: center; cursor: pointer; color: var(--text); padding: 0; }
.nav-toggle svg { width: 20px; height: 20px; }
@media (max-width: 860px) {
  .nav-toggle { display: inline-flex; }
  nav.main {
    display: none; position: absolute; top: 60px; left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 2px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 10px 16px 14px; box-shadow: 0 18px 30px rgba(0,0,0,.45);
  }
  nav.main.open { display: flex; }
  nav.main a { padding: 11px 12px; font-size: 15px; }
  nav.main a.nav-cta { margin: 8px 0 0; text-align: center; }
}

/* Feature tiles */
.f-tile { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; }
.f-tile svg { width: 19px; height: 19px; }

/* Category cards */
.cat-card { position: relative; transition: border-color .15s, transform .15s, box-shadow .15s; }
.cat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
.cat-card .icon-box svg { width: 21px; height: 21px; }
.cat-arrow { display: inline-flex; margin-left: 6px; vertical-align: -3px; opacity: 0; transition: opacity .15s, transform .15s; }
.cat-arrow svg { width: 13px; height: 13px; }
.cat-card:hover .cat-arrow { opacity: 1; transform: translateX(3px); }

/* Footer redesign */
footer.site { margin-top: 80px; border-top: 1px solid var(--border); background: var(--bg2); }
footer.site .container { padding: 44px 20px 20px; }
.footer-grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1.1fr; gap: 34px; }
.footer-brand p { color: var(--muted); font-size: 13.5px; margin: 12px 0 14px; max-width: 300px; line-height: 1.65; }
.gh-link { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.gh-link:hover { color: var(--text); border-color: var(--accent); text-decoration: none; }
.gh-link svg { width: 15px; height: 15px; }
.footer-grid h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text); }
.footer-grid h4.gap-top { margin-top: 20px; }
.footer-grid h4 + a, .footer-grid div > a:not(.gh-link):not(.brand) { display: block; color: var(--muted); font-size: 13px; padding: 3.5px 0; }
.footer-grid div > a:hover { color: var(--accent2); text-decoration: none; }
.copyright { border-top: 1px solid var(--border); margin-top: 34px; padding-top: 18px; color: var(--muted); font-size: 12.5px; }
@media (max-width: 900px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .footer-grid { grid-template-columns: 1fr; gap: 24px; } }

/* Theme variables */
:root { --soft: #c6ccd8; }
html[data-theme="light"] {
  --bg: #f5f6f9; --bg2: #ffffff; --card: #ffffff; --border: #e3e7ee;
  --text: #17202f; --muted: #5c6575; --soft: #39424f;
  --accent: #e05e00; --accent2: #b34f00;
}
html[data-theme="light"] body { background: var(--bg); }
html[data-theme="light"] header.site { background: rgba(255, 255, 255, .85); box-shadow: 0 1px 12px rgba(20, 30, 60, .06); }
html[data-theme="light"] .card:hover, html[data-theme="light"] .cat-card:hover { box-shadow: 0 10px 24px rgba(20, 30, 60, .08); }
html[data-theme="light"] .feature, html[data-theme="light"] .gh-link { background: var(--card); }

/* Theme toggle */
.nav-actions { display: flex; align-items: center; gap: 8px; margin-left: 10px; }
.theme-toggle, .nav-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  width: 36px; height: 36px; cursor: pointer; color: var(--text); padding: 0;
  transition: border-color .15s;
}
.theme-toggle:hover, .nav-toggle:hover { border-color: var(--accent); }
.theme-toggle svg { width: 17px; height: 17px; }
.theme-toggle .ic-moon { display: none; }
html[data-theme="light"] .theme-toggle .ic-sun { display: none; }
html[data-theme="light"] .theme-toggle .ic-moon { display: inline; }
@media (max-width: 860px) { .nav-actions { margin-left: auto; } nav.main { margin-left: 0; } }

/* All-tools page */
.tools-head { text-align: center; padding: 34px 0 8px; }
.tools-head h1 { font-size: 38px; margin: 0 0 10px; }
.tools-head p { color: var(--muted); max-width: 620px; margin: 0 auto; }
.tools-stats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0 26px; }
.stat-chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 12px; }
.stat-chip b { color: var(--accent); }
.tools-layout { display: grid; grid-template-columns: 230px 1fr; gap: 24px; align-items: start; }
.tools-side { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 12px; }
.side-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 2px 8px 8px; }
.side-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; color: var(--muted); cursor: pointer; font-family: inherit; }
.side-item:hover { color: var(--text); background: var(--bg2); }
.side-item.active { color: var(--text); background: rgba(255, 112, 0, .12); font-weight: 600; }
.side-item em { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 1px 8px; }
.side-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.side-note { font-size: 12px; color: var(--muted); line-height: 1.55; padding: 10px 8px 4px; border-top: 1px solid var(--border); margin-top: 8px; }
.tools-controls { display: flex; gap: 10px; margin-bottom: 14px; }
.tools-controls .search-wrap { flex: 1; }
.tools-controls select { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 0 12px; font-size: 14px; font-family: inherit; outline: none; }
.tools-count { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 999px; padding: 3px 9px; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.status.live { color: var(--ok); }
.status.soon { color: var(--muted); }
.status.soon .dot { background: var(--muted); }
@media (max-width: 860px) {
  .tools-layout { grid-template-columns: 1fr; }
  .tools-side { position: static; flex-direction: row; overflow-x: auto; padding: 8px; }
  .side-title, .side-note { display: none; }
  .side-item { width: auto; flex-shrink: 0; }
  .tools-head h1 { font-size: 28px; }
}
</style>
</head>
<body>
<main class="container" style="text-align:center;padding:100px 20px">
  <h1 style="font-size:64px;margin:0">404</h1>
  <p style="color:var(--muted);font-size:18px">This tool doesn't exist yet — but 1,800+ more are coming.</p>
  <button class="btn" style="margin-top:20px;border:0;cursor:pointer" onclick="location.href=location.pathname.replace(/\/[^\/]+\/[^\/]*\/?$/, '/')||'/'">← Back to all tools</button>
</main>
</body>
</html>
